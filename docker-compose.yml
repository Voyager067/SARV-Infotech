services:
  mongo:
    image: mongo:7
    container_name: ekart-mongo
    restart: unless-stopped
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ekart-backend
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - "127.0.0.1:5000:5000"
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://mongo:27017/ekart
      - JWT_SECRET=${JWT_SECRET:-ekart-dev-secret-change-me}
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin123}
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost:5174}
    volumes:
      - ./backend/src:/app/src
    command: npm run dev

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ekart-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "127.0.0.1:5174:5173"
    environment:
      - VITE_API_URL=http://localhost:5000/api
      - VITE_SITE_NAME=${VITE_SITE_NAME:-EKart}
      - VITE_CREATOR_NAME=${VITE_CREATOR_NAME:-Vinamra Prakash}
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/index.html:/app/index.html
    command: npm run dev -- --host

  # Zero-install web UI to browse Mongo data — no Mongo client needed on your machine.
  # Open http://localhost:8081 (login with MONGO_EXPRESS_USERNAME / MONGO_EXPRESS_PASSWORD).
  mongo-express:
    image: mongo-express:1.0.2
    container_name: ekart-mongo-express
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - "127.0.0.1:8081:8081"
    environment:
      - ME_CONFIG_MONGODB_URL=mongodb://mongo:27017/
      - ME_CONFIG_BASICAUTH_USERNAME=${MONGO_EXPRESS_USERNAME:-admin}
      - ME_CONFIG_BASICAUTH_PASSWORD=${MONGO_EXPRESS_PASSWORD:-admin123}
      - ME_CONFIG_SITE_SESSIONSECRET=ekart-mongo-express-secret

volumes:
  mongo-data:
